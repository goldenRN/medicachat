<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOS Medica AI Chatbot - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/styles/shared.css" />
    <link rel="stylesheet" href="/assets/styles/login.css" />
  </head>
  <body class="auth-body">
    <div class="background-orb orb-left"></div>
    <div class="background-orb orb-right"></div>

    <main class="auth-shell">
      <section class="login-hero">
        <div class="logo-lockup">
          <div class="logo-badge" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img">
              <path
                d="M17 25a11 11 0 0 1 21.3-3.5A9 9 0 1 1 40 39H19a7 7 0 0 1-2-14Z"
                fill="#4592ff"
              />
              <path d="M12 28h22a6 6 0 0 1 6 6v15H12V28Z" fill="#2f67d8" />
              <rect x="32" y="22" width="20" height="16" rx="2.5" fill="#ffd056" />
              <circle cx="42.5" cy="30" r="4.25" fill="none" stroke="#3f4a68" stroke-width="2.8" />
              <path d="m46.2 33.7 4.3 4.3" stroke="#3f4a68" stroke-linecap="round" stroke-width="2.8" />
              <circle cx="18" cy="36" r="1.8" fill="#ffd056" />
              <circle cx="18" cy="43" r="1.8" fill="#ffd056" />
            </svg>
          </div>
          <div>
            <p class="eyebrow">AI Knowledge Assistant</p>
            <h1>СОС Медика Монголиа</h1>
          </div>
        </div>
      </section>

      <section class="login-card">
        <div class="card-head">
          <h2>Нэвтрэх</h2>
        </div>

        <form id="login-form" class="form-stack">
          <label class="field">
            <span>Email Address</span>
            <input
              id="email-input"
              name="email"
              type="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />
          </label>

          <label class="field">
            <span>Password</span>
            <input
              id="password-input"
              name="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
          </label>

          <button class="primary-button" type="submit">Login</button>
          <p id="login-error" class="error-text" aria-live="polite"></p>
        </form>

        <footer class="login-footer">© 2026 SOS Medica Mongolia. All rights reserved.</footer>
      </section>
    </main>

    <script type="module" src="/assets/scripts/login.js"></script>
  </body>
</html>
